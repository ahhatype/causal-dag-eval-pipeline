# Bounded teaching profile, explicitly different from vendor defaults.
# @TASK@ and @SEED@ are replaced separately for every nuisance fit.
[system]
threads = 8
seed = @SEED@
gpu_devices = auto
cpu_fallback = true
time_budget_seconds = 180
log_level = warn
progress = false
[data]
header = yes
delimiter = comma
task = @TASK@
validation_fraction = 0.2
[prep]
# Affine target scaling preserves the conditional-mean target.
target_transform = robust
[learning]
rounds = 3
iterations = 5
inducing = 128
inducing_max = 256
[solver]
inducing_max = 512
[ensemble]
members = 3
parallel_members = 1
[trees]
rounds = 500
crossfit_folds = 3
[calibration]
conformal_coverage = 0
[output]
report = true
probabilities = true
precision = 17
intervals = false
[diagnostics]
level = summary
