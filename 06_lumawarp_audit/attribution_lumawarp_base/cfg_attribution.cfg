# geokernel configuration
# Every key is listed with its type, range, default and description.
# Keys marked [hyperparameter] affect the learned model; the others are system settings.
# Comments must start a line with '#' or ';'. Strings may be quoted.

[system]

# Verbosity of the stage log on standard error (info shows every stage's decisions as they happen; the report file records them regardless). The GK_LOG_LEVEL environment variable overrides this key for one run.
#   type: enum {trace|debug|info|warn|error|off}, default: warn [system]
log_level = warn

# Print one line to standard output when an ensemble member starts and when it finishes ('Fitting Member N..', 'Member N Complete..'); the only console output of a default run.
#   type: bool, default: true [system]
progress = true

# CPU worker threads for parsing, preprocessing and the CPU backend. 'auto' = number of logical cores.
#   type: int, min: 1, or 'auto', default: auto [system]
threads = auto

# Random seed for splits, sampling and initialization. Always recorded in the model.
#   type: int, min: 0, default: 20260903 [system]
seed = 20260903

# Which CUDA devices to use: 'auto' (all visible), 'none' (force CPU backend), or 'list' (use system.gpu_device_list).
#   type: enum {auto|none|list}, default: auto [system]
gpu_devices = auto

# CUDA device ordinals used when system.gpu_devices = list.
#   type: int-list, min: 0, default: 0 [system]
gpu_device_list = 0

# Allow training on the CPU reference backend when no CUDA device is available (slow).
#   type: bool, default: true [system]
cpu_fallback = true

# Wall-clock budget for training; phases degrade gracefully to meet it. 0 = unlimited.
#   type: double, min: 0, default: 7200 [system]
time_budget_seconds = 7200

# Time budget policy (ADR-0020): the candidate stages (projection axes, interactions) run only if the remaining budget is at least this multiple of the main fit's time: their own cost plus the reserve for the trees and the refit (stage profile v10). 0 = always run.
#   type: double, min: 0, default: 4.0 [system]
budget_reserve_candidates = 4.0

# Time budget policy (ADR-0020): the residual tree stage runs only if the remaining budget is at least this multiple of the main fit's time: the cross-fitted margin fits and the boosting plus the reserve for the refit. 0 = always run.
#   type: double, min: 0, default: 3.0 [system]
budget_reserve_trees = 3.0

# Measure the host and every CUDA device on the pipeline's own primitives at startup (about 0.1 s per device): the measurements order the devices, exclude one whose backend fails, flag a power-limited one, and feed the settings derived from the hardware (ADR-0021).
#   type: bool, default: true [system]
self_assessment = true

# Write <model>.ckpt after major phases so a single-member run can resume (the ensemble never checkpoints its members). Off by default: a run leaves only the model file (ADR-0033).
#   type: bool, default: false [system]
checkpoints = true

[data]

# CSV field delimiter: auto-detect among comma, semicolon, tab, pipe; or force one.
#   type: enum {auto|comma|semicolon|tab|pipe}, default: auto [system]
delimiter = auto

# Whether the first CSV row is a header: auto-detect, yes or no.
#   type: enum {auto|yes|no}, default: auto [system]
header = auto

# Field values (case-sensitive except where listed) interpreted as missing.
#   type: string-list, default: "", NA, N/A, NaN, nan, null, NULL, None, ? [system]
missing_tokens = "", NA, N/A, NaN, nan, null, NULL, None, ?

# Read at most this many data rows (0 = all). Useful for smoke tests.
#   type: int, min: 0, default: 0 [system]
max_rows = 0

# Number of trailing label columns (1 = single target; >1 = multi-output regression).
#   type: int, min: 1, max: 64, default: 1 [system]
label_columns = 1

# Fraction of labeled rows held out for noise selection, accept/reject decisions, calibration and reporting. auto = max(0.1, data.validation_min_rows / n) capped at data.validation_max_fraction (small tables get a larger jury; the refit on all rows recovers the training cost).
#   type: double, min: 0, max: 0.5, or 'auto', default: 0.1 [system]
validation_fraction = 0.1

# data.validation_fraction = auto aims for at least this many validation rows.
#   type: int, min: 20, default: 500 [system]
validation_min_rows = 500

# data.validation_fraction = auto never holds out more than this fraction.
#   type: double, min: 0.1, max: 0.5, default: 0.25 [system]
validation_max_fraction = 0.25

# Hold-out drawn as one group of a stratified partition (by class, or by target quantile for regression), so a rare class keeps its share in the jury that selects the noise, the calibration and the trees (v15 maps: a 2-positive hold-out drove the rare-positive failure).
#   type: bool, default: true [system]
validation_stratified = true

# Cap on the number of validation rows.
#   type: int, min: 100, default: 100000 [system]
validation_max_rows = 100000

# Optional column name (or 0-based index) whose order defines time; enables time-aware splits and target statistics.
#   type: string, default: "" [system]
time_column = ""

# Optional column name (or 0-based index) defining groups that must not be split across folds.
#   type: string, default: "" [system]
group_column = ""

# Learning task: auto-infer from the label column, or force regression, binary classification or multiclass classification. Multi-output regression uses data.label_columns > 1.
#   type: enum {auto|regression|binary|multiclass}, default: auto [system]
task = auto

# Maximum number of classes accepted for classification.
#   type: int, min: 2, max: 100000, default: 1000 [system]
classification_max_classes = 1000

# Integer-valued numeric labels with at most max(20, ratio*n) distinct values are treated as classes.
#   type: double, min: 0, max: 1, default: 0.001 [system]
classification_distinct_ratio = 0.001

[prep]

# Categorical columns with 3..this many levels get a learned similarity matrix; more levels use target statistics + frequency axes.
#   type: int, min: 3, max: 4096, default: 64 [hyperparameter]
categorical_mid_max = 64

# Integer-valued numeric columns with at most this many distinct values are treated as discrete (ordinal path).
#   type: int, min: 3, max: 100000, default: 20 [hyperparameter]
numeric_discrete_max_distinct = 20

# Stop counting distinct numeric values beyond this cap (profiling cost control).
#   type: int, min: 100, max: 1e+08, default: 100000 [system]
distinct_count_cap = 100000

# Points in the empirical-CDF tables used by rank transforms at inference (exact when the column has fewer distinct rows).
#   type: int, min: 16, max: 1.04858e+06, default: 4096 [hyperparameter]
quantile_table_size = 4096

# Blend between the rank CDF (0) and the affine min/max CDF (1) inside the arcsine transform of numeric axes.
#   type: double, min: 0, max: 1, default: 0.5 [hyperparameter]
blend_lambda = 0.5

# Also emit a robust-affine 'raw' axis for each continuous numeric feature so relevance determination can prefer magnitude geometry; auto = only when rows <= prep.raw_candidate_max_rows.
#   type: enum {auto|true|false}, default: auto [hyperparameter]
raw_candidate_axis = auto

# Row threshold for prep.raw_candidate_axis = auto.
#   type: int, min: 1, default: 100000 [hyperparameter]
raw_candidate_max_rows = 100000

# Quantile clipped at each tail by the robust-affine raw axis.
#   type: double, min: 0, max: 0.25, default: 0.005 [hyperparameter]
raw_tail_fraction = 0.005

# The raw axis maps its clipped range to [-raw_range, raw_range].
#   type: double, min: 0.1, max: 1, default: 0.95 [hyperparameter]
raw_range = 0.95

# Also emit a robust-affine axis on log(x) for strictly positive columns with skewness >= prep.log_candidate_skewness (smooth responses to frequencies, incomes, counts are smooth in log(x)); auto = whenever raw candidates are emitted.
#   type: enum {auto|true|false}, default: false [hyperparameter]
log_candidate_axis = false

# Minimum skewness of a strictly positive column for the log candidate axis.
#   type: double, min: 0, max: 100, default: 1 [hyperparameter]
log_candidate_skewness = 1

# Emit a two-point missingness indicator axis for every feature with missing values.
#   type: bool, default: true [hyperparameter]
missing_indicator = true

# Level codes of high-cardinality categoricals as a finite axis the kernel skips; the residual trees split on it (level partitions and categorical interactions the target statistics cannot express).
#   type: bool, default: true [hyperparameter]
high_cardinality_code_axis = true

# Emit a log-frequency axis for high-cardinality categorical features.
#   type: bool, default: true [hyperparameter]
frequency_axis = true

# Numeric columns whose most frequent value covers at least this share of the rows (zero-inflated or near-constant columns) get a two-point 'is mode value' axis, and their rank/raw axes are fitted on the remaining values with the mode rows marginalized. 1 disables.
#   type: double, min: 0, max: 1, default: 0.2 [hyperparameter]
point_mass_share = 0.2

# Regression target transform: robust (median/MAD), gaussianize (rank-normal with exact inverse), none; auto = robust unless |excess kurtosis| exceeds prep.gaussianize_kurtosis_threshold.
#   type: enum {auto|none|robust|gaussianize}, default: auto [hyperparameter]
target_transform = auto

# Kurtosis above which prep.target_transform = auto selects gaussianize.
#   type: double, min: 0, default: 10 [hyperparameter]
gaussianize_kurtosis_threshold = 10

# Shrinkage weight a of the prior in target statistics: (sum y + a prior)/(count + a).
#   type: double, min: 1e-06, default: 1 [hyperparameter]
ts_prior_weight = 1

# Several prior weights for the target statistics of high-cardinality categoricals: each weight yields its own statistic and axis (rare levels are pulled toward the global mean at different rates). At its default the single prep.ts_prior_weight is used.
#   type: double-list, default: 1 [hyperparameter]
ts_prior_weights = 1

# Folds for cross-fitted (kfold) target statistics.
#   type: int, min: 2, max: 64, default: 5 [hyperparameter]
ts_folds = 5

# Leakage-free scheme for training-row target statistics: kfold (cross-fitting) or ordered (CatBoost-style random-permutation history).
#   type: enum {kfold|ordered}, default: kfold [hyperparameter]
ts_scheme = kfold

[coordinates]

# Learned linear map: add up to this many projection axes from the top eigenvectors of the average gradient outer product over the rank coordinates (RFM/AGOP); kept only if validation improves. 0 = off.
#   type: int, min: 0, max: 64, default: 4 [hyperparameter]
projection_axes = 4

# Training rows sampled to estimate the gradient outer product.
#   type: int, min: 64, max: 1e+06, default: 4096 [hyperparameter]
agop_rows = 4096

# Minimum share of the gradient-outer-product trace an eigen-direction needs to become a projection axis.
#   type: double, min: 0, max: 1, default: 0.02 [hyperparameter]
min_eigen_share = 0.02

# Directions whose largest component exceeds this are skipped (they duplicate an existing axis).
#   type: double, min: 0.5, max: 1, default: 0.95 [hyperparameter]
max_alignment = 0.95

# Geometry-learning rounds after adding projection axes (0 = fit only).
#   type: int, min: 0, max: 100, default: 2 [hyperparameter]
projection_learning_rounds = 2

# Learned interactions: add up to this many crossed finite axes for the pairs of binary / mid-cardinality categorical features with the largest interaction gain beyond their additive effects (two-way ANOVA on the training targets); each crossed axis has its own Gram, initialized from the Kronecker product of the marginal Grams; kept only if validation improves. 0 = off.
#   type: int, min: 0, max: 32, default: 3 [hyperparameter]
interaction_pairs = 3

# Levels of a crossed axis: the most frequent level pairs, the rest share one 'other' level.
#   type: int, min: 4, max: 1024, default: 64 [hyperparameter]
interaction_max_levels = 64

# Minimum interaction gain (share of the target variance explained beyond the additive model, noise-corrected) for a pair to be crossed.
#   type: double, min: 0, max: 1, default: 0.002 [hyperparameter]
interaction_min_gain = 0.002

# Geometry-learning rounds after adding crossed axes (0 = fit only).
#   type: int, min: 0, max: 100, default: 3 [hyperparameter]
interaction_learning_rounds = 3

# Let interaction candidates include high-cardinality categoricals: such pairs get leakage-free target statistics of their level combinations (CatBoost-style feature combinations) as numeric axes instead of a crossed Gram axis.
#   type: bool, default: true [hyperparameter]
pair_target_stats = true

# Initial Gram of a crossed axis: (1 - rho) x identity (sharp cell similarity) + rho x Kronecker product of the marginal Grams (what the product kernel already encodes); unit trace. 1 = pure Kronecker, 0 = pure identity.
#   type: double, min: 0, max: 1, default: 0.5 [hyperparameter]
interaction_shrinkage = 0.5

# Candidate axes (projections, crossings) are kept when their validation loss is below the incumbent's times (1 + this). 0 = strict improvement; positive values prefer the richer model; negative values demand a margin.
#   type: double, min: -1, max: 10, default: 0 [hyperparameter]
acceptance_tolerance = 0

# Cyclic numeric columns as name:period entries (e.g. "hour:24, month:12"); each becomes sin/cos axes.
#   type: string-list, default: "" [system]
periodic_columns = 

[kernel]

# Chebyshev basis functions per polynomial axis (S). Larger = more flexible per-axis geometry, cost grows like S^2 per axis per kernel entry.
#   type: int, min: 2, max: 256, default: 16 [hyperparameter]
degree = 16

# Per-axis resolution (ADR-0023). fixed: every polynomial axis has kernel.degree basis functions. adaptive: a continuous axis (rank, raw, log, rank-Gaussian role) whose marginal generalized cross-validation (ridge regression of the targets on its Chebyshev features, nested sizes 24/32/48/64 up to kernel.degree_max) improves by kernel.degree_gcv_gain over the default size gets the best size; the learner then adapts that axis's operator at the finer resolution. Applies with at least kernel.degree_min_rows training rows and kernel.degree_min_distinct distinct values; the report section [resolution] lists the axes raised.
#   type: enum {fixed|adaptive}, default: fixed [hyperparameter]
degree_mode = fixed

# Adaptive resolution: largest basis size an axis may take.
#   type: int, min: 2, max: 256, default: 48 [hyperparameter]
degree_max = 48

# Adaptive resolution: with fewer training rows every axis keeps kernel.degree (the marginal probe is too noisy).
#   type: int, min: 1, default: 2000 [hyperparameter]
degree_min_rows = 2000

# Adaptive resolution: axes with fewer distinct training values keep kernel.degree (a size above a quarter of the distinct count interpolates rather than smooths).
#   type: int, min: 2, default: 64 [hyperparameter]
degree_min_distinct = 64

# Adaptive resolution: relative marginal-GCV improvement a larger size must show over kernel.degree to be adopted.
#   type: double, min: 0, max: 1, default: 0.02 [hyperparameter]
degree_gcv_gain = 0.02

# Adaptive resolution: rows entering the marginal probe (a uniform stride sample of the training rows).
#   type: int, min: 100, default: 50000 [hyperparameter]
degree_probe_rows = 50000

# Highest derivative order in the left-definite form (0 = pure mass, 1 = Sobolev-1, 2 = bending).
#   type: int, min: 0, max: 4, default: 2 [hyperparameter]
max_order = 2

# Piecewise-constant coefficient cells per axis (theta-uniform partition of [-1, 1]).
#   type: int, min: 1, max: 64, default: 8 [hyperparameter]
cells = 8

# Boundary mass orders (0..max_order): learned endpoint masses that select the self-adjoint extension.
#   type: int, min: 0, max: 4, default: 1 [hyperparameter]
boundary_orders = 1

# Parametric spectral tail psi_i: matern (1+(i/l)^2)^(-nu/2) or geometric q^i.
#   type: enum {matern|geometric}, default: matern [hyperparameter]
tail = matern

# Spectral function g applied to the operator: power (lambda^s) or heat (exp(t lambda)).
#   type: enum {power|heat}, default: power [hyperparameter]
spectral = power

# Initial relevance theta_d of every axis in the ANOVA product (1 + theta_d k_d); auto = 1/D.
#   type: double, min: 1e-09, or 'auto', default: auto [hyperparameter]
theta_init = auto

# How relevances start when kernel.theta_init = auto: explained = theta_d proportional to the target variance explained by a ridge fit on axis d alone (sum kernel.theta_init_total, floor 0.05/D); uniform = 1/D.
#   type: enum {explained|uniform}, default: explained [hyperparameter]
theta_init_mode = explained

# Sum of the initial relevances under kernel.theta_init_mode = explained.
#   type: double, min: 1e-06, default: 2 [hyperparameter]
theta_init_total = 2

# Initial Gram of finite axes: (1-rho) I + rho 11^T/K, unit trace. 0 = distinct levels, 1 = all alike.
#   type: double, min: 0, max: 1, default: 0.5 [hyperparameter]
finite_set_shrinkage = 0.5

# Initial Gram of finite (categorical) axes: shrinkage = identity blended with a constant; target = additionally blended with a Gaussian similarity of the levels' shrunken standardized target means (levels with similar target means start similar, the prior behind target-ordered tree splits).
#   type: enum {shrinkage|target}, default: shrinkage [hyperparameter]
finite_init = shrinkage

# Weight of the target-similarity part under kernel.finite_init = target.
#   type: double, min: 0, max: 1, default: 0.5 [hyperparameter]
finite_target_weight = 0.5

# Prior count shrinking a level's target mean toward the global mean.
#   type: double, min: 0, default: 5 [hyperparameter]
finite_target_prior = 5

# After geometry learning, drop kernel axes whose relevance theta_d is below this fraction of the largest relevance in their component (0 = keep every axis). Their factor (1 + theta_d k_d) is ~1, so the fit stages get faster on wide tables at negligible change of the predictor.
#   type: double, min: 0, max: 1, default: 0 [hyperparameter]
prune_theta_ratio = 0

# Initial kernel amplitude sigma^2.
#   type: double, min: 1e-12, default: 1 [hyperparameter]
amplitude_init = 1

# Product components sharing the axes, K = sum_c w_c prod_d (1 + theta_cd k_cd): mixtures realize Kronecker-sum (multi-scale) kernels; each component has its own geometry, relevances and learned weight.
#   type: int, min: 1, max: 4, default: 1 [hyperparameter]
mixture_components = 1

# Initial spectral length scale ratio between neighbouring components (component c uses spread^(c-(C-1)/2)).
#   type: double, min: 1, max: 100, default: 2 [hyperparameter]
mixture_spread = 2

[learning]

# Learn the geometry (operator coefficients, relevances, finite Grams, noise) on rotating hold-out batches before the final fit.
#   type: bool, default: true [hyperparameter]
enabled = true

# Rounds of rotating fit/evaluation batches.
#   type: int, min: 1, max: 1000, default: 6 [hyperparameter]
rounds = 6

# L-BFGS iterations per round.
#   type: int, min: 1, max: 1000, default: 8 [hyperparameter]
iterations = 8

# Fit-batch rows in the first round.
#   type: int, min: 8, default: 2048 [hyperparameter]
fit_rows = 2048

# Evaluation-batch rows in the first round.
#   type: int, min: 8, default: 2048 [hyperparameter]
eval_rows = 2048

# Inducing points used inside geometry learning (first round).
#   type: int, min: 4, default: 512 [hyperparameter]
inducing = 512

# The inducing count grows with the batch (x learning.growth per round) up to this cap, so late rounds learn the geometry near the deployment scale.
#   type: int, min: 4, default: 2048 [hyperparameter]
inducing_max = 2048

# Cap on fit-batch rows as batches grow.
#   type: int, min: 8, default: 65536 [hyperparameter]
max_fit_rows = 65536

# Cap on evaluation-batch rows as batches grow.
#   type: int, min: 8, default: 16384 [hyperparameter]
max_eval_rows = 16384

# Batch growth factor per round.
#   type: double, min: 1, max: 10, default: 1.5 [hyperparameter]
growth = 1.5

# Partitions per learning round whose hold-out objectives (and gradients) are averaged: a K-fold rotation smooths the objective of small tables. auto = 4 when the training rows are at most learning.folds_max_rows, else 1.
#   type: int, min: 1, max: 16, or 'auto', default: 1 [hyperparameter]
folds = 1

# learning.folds = auto uses 4 folds up to this many training rows.
#   type: int, min: 0, default: 5000 [hyperparameter]
folds_max_rows = 5000

# Acceptance test of the learned geometry: none = always keep it; validation = also fit the initial kernel with the same ridge selection and keep whichever validates better (one extra fit; guards small tables where the learner overfits its own batch objective).
#   type: enum {none|validation}, default: none [hyperparameter]
acceptance = none

# learning.acceptance = validation: the learned geometry is discarded only when the initial kernel's validation loss is lower by more than this relative margin.
#   type: double, min: 0, max: 1, default: 0 [hyperparameter]
acceptance_tolerance = 0

# holdout = batch hold-out loss of a subset-of-regressors fit on rotating growing batches (default); anchor = the manuscript regime: a fixed small anchor set carries the inner fit's labels and is the inducing set ((K_AA + sigma^2 I) w = y_A), the loss is taken on many other rows, so only the kernel can reduce it.
#   type: enum {holdout|anchor}, default: holdout [hyperparameter]
objective = holdout

# learning.objective = anchor: number of anchor rows (support vectors), drawn once at random.
#   type: int, min: 2, default: 32 [hyperparameter]
anchor_rows = 32

# L-BFGS stopping rule: false = stop when the decrease is below learning.relative_tolerance x (1 + loss), which is an absolute threshold for losses far below 1; true = below learning.relative_tolerance x loss.
#   type: bool, default: false [hyperparameter]
tolerance_relative_to_loss = false

# Learner: device-resident kernel blocks (fit x inducing, eval x inducing) computed once per evaluation and reused by the predictions and the adjoint (the blocks were recomputed three to four times per evaluation); 0 streams every call. auto: derived from the free device memory and the members sharing the device (ADR-0021).
#   type: int, min: 0, or 'auto', default: auto [system]
gram_cache_mb = auto

# Relative diagonal jitter of the learner's inducing systems (x mean diagonal); escalated x100 on a failed factorization. Diagnostics showed 1e-9 sits below the float32 conditioning floor (escalations on most evaluations).
#   type: double, min: 0, default: 1e-9 [hyperparameter]
jitter = 1e-9

# Learn per-axis relevances theta_d (automatic relevance determination).
#   type: bool, default: true [hyperparameter]
learn_theta = true

# Learn the left-definite operator coefficients, boundary masses and spectral tail.
#   type: bool, default: true [hyperparameter]
learn_operator = true

# Learn the Gram matrices of finite (categorical / two-point) axes.
#   type: bool, default: true [hyperparameter]
learn_finite = true

# Learn the relative noise variance jointly.
#   type: bool, default: true [hyperparameter]
learn_noise = true

# Learn the mixture component weights (kernel.mixture_components > 1).
#   type: bool, default: true [hyperparameter]
learn_weights = true

# Initial relative noise variance for geometry learning.
#   type: double, min: 1e-09, max: 100, default: 0.1 [hyperparameter]
init_noise_relative = 0.1

# L-BFGS history length.
#   type: int, min: 1, max: 100, default: 10 [hyperparameter]
lbfgs_memory = 10

# Maximum per-parameter step (log-space) in one L-BFGS iteration.
#   type: double, min: 0.001, max: 10, default: 0.5 [hyperparameter]
max_step = 0.5

# Log-space length (infinity norm) of a steepest-descent L-BFGS step, i.e. the first iteration of every round: the raw gradient's length is the objective's scale (about 0.01 on unit-variance targets, so the first iteration of each round barely moves), this makes it scale-free. 0 = the raw gradient, capped by learning.max_step.
#   type: double, min: 0, max: 10, default: 0 [hyperparameter]
first_step = 0

# Diagnostics (level full, round 0): points per side of a 1-D scan of the learning objective along each gradient-checked parameter, with the jitter as in training and frozen at the centre's level; the values and jitter levels go to the learning/objective_scan event. 0 = off.
#   type: int, min: 0, default: 0 [hyperparameter]
objective_scan_points = 0

# Half-width of the objective scan in log-parameter space.
#   type: double, min: 1e-06, max: 10, default: 0.02 [hyperparameter]
objective_scan_halfwidth = 0.02

# Evaluations between downward probes of the inducing systems' jitter level (each probe tries one level lower); 0 = one probe at the first evaluation of each round, so that the objective is the same function throughout the round's line searches.
#   type: int, min: 0, default: 8 [hyperparameter]
jitter_probe = 8

# Quadratic penalty pulling learned log-parameters toward their initial values.
#   type: double, min: 0, default: 1e-3 [hyperparameter]
parameter_penalty = 1e-3

# Rows per tile in the adjoint accumulation.
#   type: int, min: 16, max: 1.04858e+06, default: 2048 [system]
tile_rows = 2048

# Stop a round's L-BFGS when the relative loss decrease per iteration falls below this. 1e-6 (default) stops rounds early on noisy hold-out batches, which measured as a useful regularizer (v02 ablation); 1e-9 runs every iteration.
#   type: double, min: 0, max: 1, default: 1e-6 [hyperparameter]
relative_tolerance = 1e-6

[solver]

# Number of inducing (Nystrom) points m; auto = min(rows, solver.inducing_max).
#   type: int, min: 1, or 'auto', default: auto [hyperparameter]
inducing = auto

# Upper bound for the automatic inducing set size (memory O(m^2), solve O(m^3)); auto = 4096 on a CUDA backend, 2048 on the CPU reference backend (hardware-driven path).
#   type: int, min: 1, or 'auto', default: auto [hyperparameter]
inducing_max = auto

# Inducing point selection: random subset, or greedy farthest-point (k-center) in the learned kernel metric over a candidate pool.
#   type: enum {random|farthest|learner}, default: random [hyperparameter]
selection = random

# Farthest-point selection draws its candidate pool as this many times m random rows.
#   type: int, min: 1, max: 1000, default: 8 [hyperparameter]
selection_candidates = 8

# Candidate noise variances sigma_n^2 relative to the target variance; the validation rows select one. The data term of the Nystrom normal equations grows with n, so values far above the target variance are legitimate ridge levels.
#   type: double-list, min: 0, default: 1e-4, 1e-3, 1e-2, 3e-2, 1e-1, 3e-1, 1, 3, 10, 30, 100, 300, 1000 [hyperparameter]
noise_grid = 1e-4, 1e-3, 1e-2, 3e-2, 1e-1, 3e-1, 1, 3, 10, 30, 100, 300, 1000

# Hold-out selection: replace the argmin noise level's coefficients by the validation-likelihood-weighted average of the grid's coefficient vectors (one model, no extra solve; weights exp(-n_v * loss difference) for log loss, Gaussian for squared loss), kept only if its hold-out loss stays within 1 % of the best trial. Flat curves average, sharp curves keep the argmin (v30 group B: small tables, selection variance across members).
#   type: bool, default: false [hyperparameter]
noise_average = false

# How the noise level is selected: holdout = validation rows; cv = k-fold cross-validation over the training rows (solver.cv_folds) with a final full-data solve; auto = cv when the training rows are at most solver.cv_max_rows. Default holdout: cross-validating inside rows that already shaped the learned geometry under-regularizes (v03 measurement).
#   type: enum {holdout|cv|auto}, default: holdout [hyperparameter]
ridge_selection = holdout

# Folds of the cross-validated ridge selection.
#   type: int, min: 2, max: 20, default: 5 [hyperparameter]
cv_folds = 5

# Refit guard: the coefficients refitted on all rows are kept only if they move the hold-out predictions by at most this relative l2 change (and stay finite); otherwise the selected coefficients stay (v19: one ensemble member's refit diverged, change 345, and dominated the averaged logits). 0 = no guard.
#   type: double, min: 0, default: 1.0 [hyperparameter]
refit_max_change = 1.0

# After model selection, calibration and validation metrics, refit the coefficients on all labeled rows (training + validation) at the selected noise level; the reported validation figures remain those of the hold-out model.
#   type: bool, default: true [hyperparameter]
refit_all_rows = true

# solver.ridge_selection = auto cross-validates the ridge level up to this many training rows (the 10 % hold-out is too small a jury below that).
#   type: int, min: 0, default: 10000 [hyperparameter]
cv_max_rows = 10000

# Relative diagonal jitter added to the ridge system (scaled by its mean diagonal).
#   type: double, min: 0, default: 1e-8 [hyperparameter]
jitter = 1e-8

# Rows per streamed kernel tile (memory tile_rows x m floats).
#   type: int, min: 64, max: 1.04858e+06, default: 4096 [system]
tile_rows = 4096

# Classification fit: squared (0/1 or one-hot regression + Platt / temperature scaling; default, one normal-equation pass) or logistic (iteratively reweighted least squares on the inducing expansion; binary sigmoid or multinomial softmax with per-class diagonal Newton steps; ridge selected by validation log loss; better probabilities at several passes per class).
#   type: enum {logistic|squared}, default: logistic [hyperparameter]
classification_loss = logistic

# Maximum majorization steps per ridge level of the logistic fit (Bohning's curvature bound: 1/4 sigmoid, 1/2 softmax; monotone, one factorization per level; warm-started; stops early when the relative step falls below 1e-4).
#   type: int, min: 1, max: 1000, default: 40 [hyperparameter]
logistic_iterations = 40

# Hold-out ridge search over solver.noise_grid: full = every value; coarse = every other value (both ends included), then the neighbours of the best — the same minimum on a unimodal validation curve with ~35 % fewer factorizations.
#   type: enum {full|coarse}, default: full [hyperparameter]
ridge_search = full

# Acceleration of the logistic majorization iterations: none = plain fixed point (linear rate, often capped by solver.logistic_iterations); anderson = safeguarded Anderson mixing over the last five residuals (falls back to the plain step whenever the training log loss rises).
#   type: enum {none|anderson}, default: none [hyperparameter]
logistic_acceleration = none

# Ridge grid values tried with IRLS, centred just below the winner of the cheap squared-loss grid search; 0 = the whole noise grid.
#   type: int, min: 0, max: 64, default: 4 [hyperparameter]
logistic_candidates = 4

# Cache the validation kernel block when it fits in this many MB; otherwise recompute per trial.
#   type: int, min: 0, max: 65536, default: 256 [system]
validation_cache_mb = 256

# Logistic fits: host cache of the training Gram K_nm (n x inducing floats) reused across every majorization pass and ridge trial when it fits in this budget; larger tables recompute the Gram on every pass. auto: the table's need capped by half the available host RAM shared by the concurrent members (ADR-0021).
#   type: int, min: 0, or 'auto', default: auto [system]
training_cache_mb = auto

[numerics]

# Bitwise-reproducible results (ordered reductions, fixed tiling) at some cost in throughput.
#   type: bool, default: false [system]
deterministic = false

# GPU ridge solves: fp32 Cholesky with fp64 iterative refinement (fp64 fallback when it does not converge). Measured slower at the condition numbers of the inducing systems (the refinement rarely converges): off; auto = on for GPUs with a weak fp64 rate.
#   type: enum {auto|on|off}, default: off [system]
mixed_precision_solve = off

# Learner adjoint GEMMs on TF32 tensor cores (gradient precision ~1e-3). Measured no gain (the adjoint is bound by its elementwise pass): off.
#   type: bool, default: false [system]
adjoint_tensor_cores = false

# fp32 normal-equation path: accumulate each sub-tile's K^T K as a symmetric rank-k update on one triangle (cuBLAS SYRK) and mirror it once at the end, instead of a full GEMM: half the flops and half the fp64 accumulation traffic; the sums are the same up to fp32 blocking order. Quality gate in research/v23_speed (lever 5b).
#   type: bool, default: false [system]
normal_equations_syrk = false

# GPU precision for K^T K accumulation: fp64 GEMMs, or fp32 sub-tiles accumulated in fp64; auto = fp64 when the device's fp32:fp64 throughput ratio is at most 4 (datacenter GPUs), else fp32.
#   type: enum {auto|fp32|fp64}, default: auto [system]
normal_equations = auto

[semi_supervised]

# Use unlabeled rows (empty label) through an empirical Dirichlet-form penalty on a k-NN graph in the learned kernel metric; the strength is selected on the validation rows (only when unlabeled rows exist).
#   type: bool, default: true [hyperparameter]
enabled = true

# Nearest neighbours per graph row.
#   type: int, min: 1, max: 256, default: 10 [hyperparameter]
neighbors = 10

# Maximum graph rows (all unlabeled rows first, then labeled rows); cost grows quadratically.
#   type: int, min: 16, max: 1e+06, default: 20000 [hyperparameter]
max_rows = 20000

# Candidate penalty strengths gamma, relative to tr(K^T K)/tr(P); 0 (no penalty) is always a candidate.
#   type: double-list, min: 0, default: 0.1, 1, 10 [hyperparameter]
strength_grid = 0.1, 1, 10

# Gaussian edge-weight bandwidth as a multiple of the median k-NN distance.
#   type: double, min: 0.01, max: 100, default: 1 [hyperparameter]
bandwidth_scale = 1

[calibration]

# Calibrate classification probabilities on the validation rows (Platt sigmoid for binary, temperature scaling for multiclass).
#   type: bool, default: true [hyperparameter]
enabled = true

# Temperature scaling (multiclass): prior toward T = 1 worth this many pseudo-observations, so a small validation set cannot select an extreme temperature (maternal_health_risk: 68 rows chose T = 0.18).
#   type: double, min: 0, default: 50 [hyperparameter]
temperature_prior_rows = 50

# Multiclass: ridge (relative to the score variance) of the C x C output-mixing map fitted on the validation scores (linear coregionalization); kept only if the calibrated log loss improves. Negative disables.
#   type: double, min: -1, default: 0.01 [hyperparameter]
output_mixing_ridge = 0.01

# Target coverage of split-conformal prediction intervals (regression) / label sets (classification), calibrated on the validation rows. 0 disables.
#   type: double, min: 0, max: 0.999, default: 0.9 [hyperparameter]
conformal_coverage = 0.9

[trees]

# Residual gradient-boosted trees after the kernel fit (the kernel -> trees path, hybrid plan 2.4): in-house histogram GBDT boosted from the kernel's out-of-sample margin on the training rows, early-stopped on the hold-out, added to the model's scores.
#   type: bool, default: true [hyperparameter]
enabled = true

# kernel = boost from the kernel's out-of-sample margin (the hybrid); constant = trees alone on a constant bias (the kernel is fitted but not used for scoring; ablation baseline); auto = constant, with geometry learning skipped, when the axes two-point axes per training row exceed trees.base_auto_two_point_axes_per_row (fingerprint tables: the learned geometry overfits and the trees with column sampling are the robust learner, v30 group D), otherwise kernel.
#   type: enum {kernel|constant|auto}, default: auto [hyperparameter]
base = auto

# trees.base = auto: binary and point-mass axes (not missing indicators) per member training row above which the member is trees alone without geometry learning. Fingerprint tables sit at 0.31-0.79 (QSAR-TID-11, hiva_agnostic, Bioresponse), every other TabArena table below 0.1 (MIC 0.097, where trees alone is 9 % worse).
#   type: double, min: 0, default: 0.2 [hyperparameter]
base_auto_two_point_axes_per_row = 0.2

# Kernel margin on the training rows: crossfit = K-fold cross-fitted predictions (every row scored by a kernel fit that did not see it, at the selected noise and inducing count); insample = the selected fit's own training predictions (optimistic residuals, for comparison).
#   type: enum {crossfit|insample}, default: crossfit [hyperparameter]
residual = crossfit

# Folds of the cross-fitted kernel margin.
#   type: int, min: 2, max: 20, default: 4 [hyperparameter]
crossfit_folds = 4

# Cross-fitted margins: re-solve the fold and pair fits from the main fit's normal equations minus the held-out rows' contribution (same inducing set and noise) instead of refitting from scratch: one normal-equation pass instead of six. Logistic fits need the training Gram in the cache (solver.training_cache_mb), else they refit as before. auto = on from trees.crossfit_downdate_min_rows training rows (below it the shared pass costs more than it saves; research/v23_speed).
#   type: enum {auto|on|off}, default: auto [hyperparameter]
crossfit_downdate = auto

# Training rows from which crossfit_downdate = auto re-solves the fold fits instead of refitting them.
#   type: int, min: 0, default: 6000 [hyperparameter]
crossfit_downdate_min_rows = 6000

# Skip the tree stage below this many training rows.
#   type: int, min: 0, default: 200 [hyperparameter]
min_rows = 200

# Maximum boosting rounds (one tree per output per round). 3 000 since v25: the residual booster carries 5-19 % of the loss on the numeric regressions and the 1 000 cap bound it there.
#   type: int, min: 1, max: 100000, default: 3000 [hyperparameter]
rounds = 3000

# Shrinkage applied to every leaf value. 0.05 since v25 (with 63 leaves and 3 000 rounds): -0.9 % geometric mean over the 10 large regressions, 8 better / 0 worse, classification neutral, +30-50 % tree time on the large tables; v16 had chosen 0.1 on the small set.
#   type: double, min: 0.0001, max: 1, default: 0.05 [hyperparameter]
learning_rate = 0.05

# Leaves per tree (leaf-wise growth). 63 since v25 (research/v25_gap_analysis): with rate 0.05 and 3 000 rounds the residual booster matches XGBoost's default within 0.5 % on the numeric regressions; the v16 small benchmark had chosen 15 at rate 0.1.
#   type: int, min: 2, max: 4096, default: 63 [hyperparameter]
max_leaves = 63

# Depth cap per tree (0 = unlimited).
#   type: int, min: 0, max: 64, default: 8 [hyperparameter]
max_depth = 8

# Minimum (sampled) training rows per leaf.
#   type: int, min: 1, default: 20 [hyperparameter]
min_rows_per_leaf = 20

# Minimum hessian sum per leaf.
#   type: double, min: 0, default: 0.001 [hyperparameter]
min_hessian_per_leaf = 0.001

# Leaf L2 regularization lambda: leaf value = -G / (H + lambda).
#   type: double, min: 0, default: 1 [hyperparameter]
l2 = 1

# Minimum split gain G_L^2/(H_L+lambda) + G_R^2/(H_R+lambda) - G^2/(H+lambda).
#   type: double, min: 0, default: 0 [hyperparameter]
min_gain = 0

# Bernoulli row sampling rate per round.
#   type: double, min: 0.05, max: 1, default: 0.8 [hyperparameter]
row_subsample = 0.8

# Fraction of the usable features drawn per round.
#   type: double, min: 0.05, max: 1, default: 0.8 [hyperparameter]
column_subsample = 0.8

# Maximum histogram bins per numeric feature (equal-mass edges; exact bins when the distinct values fit).
#   type: int, min: 2, max: 255, default: 255 [hyperparameter]
bins = 255

# Stop after this many rounds without hold-out improvement (0 = never).
#   type: int, min: 0, default: 50 [hyperparameter]
early_stopping_rounds = 50

# How the round count is chosen: crossval = minimizer of the K-fold cross-validated loss curve over the training rows (K = trees.crossfit_folds; the final forest is refitted on all training rows at that count; the hold-out only reports), holdout = early stopping on the hold-out rows (a 100-row hold-out selects the round by noise: class_overlap hold-out -4.6 %, test +5.6 % in v16).
#   type: enum {crossval|holdout}, default: crossval [hyperparameter]
stopping = crossval

# Candidate multipliers w of the kernel margin the trees boost from (F0 = w * kernel + (1 - w) * constant); chosen together with the round count by the cross-validated (or hold-out) loss. w = 0 lets the trees replace a kernel whose margin does not help (rare positives: trees alone 1-AUC 0.088 vs hybrid 0.138 in v16); '1' disables the search.
#   type: double-list, default: 1,0.5,0 [hyperparameter]
base_scales = 1,0.5,0

# auto = candidates {1, w_ls, 0}, w_ls the closed-form scale of the kernel margin against the targets (least squares, or Newton on the one-dimensional logistic problem); grid = the trees.base_scales list.
#   type: enum {auto|grid}, default: auto [hyperparameter]
base_scale_mode = auto

# Hold-out veto: the selected forest is attached only if the hold-out loss of the hybrid does not exceed the kernel's by more than this relative amount (an unbiased second opinion against the cross-validation's sample-size optimism on smooth targets; v16 smooth control: cv +2.5 %, hold-out -3.5 %, test -3.4 %).
#   type: double, min: 0, default: 0.01 [hyperparameter]
holdout_tolerance = 0.01

# Budget of trees per ensemble member: the round cap becomes min(trees.rounds, budget / classes), so that a K-class problem grows the trees a binary problem may grow rather than K times as many (a weak base on a 10-class table otherwise runs to trees.rounds x 10 trees per member for model size and inference time). 0 = no budget.
#   type: int, min: 0, default: 0 [hyperparameter]
max_trees_per_member = 0

# Round count = the smallest round whose selection loss (fold-averaged, or the hold-out) is within this relative tolerance of its minimum, the one-standard-error rule in its simplest form; 0 = the argmin. A curve that keeps creeping down (weak base, many classes) otherwise runs to trees.rounds for model size and inference time alone.
#   type: double, min: 0, default: 0 [hyperparameter]
rounds_plateau = 0

# The full kernel margin (w = 1) is kept unless a smaller candidate lowers the selection loss by more than this relative amount (the fold kernels are fitted on fewer rows than the final one, which handicaps the kernel in the comparison).
#   type: double, min: 0, default: 0.02 [hyperparameter]
base_scale_tolerance = 0.02

# Levels beyond the most frequent (max - 1) share one histogram bin.
#   type: int, min: 2, max: 255, default: 255 [hyperparameter]
max_categorical_levels = 255

# Pseudo-hessian in the categorical level ordering statistic G / (H + s).
#   type: double, min: 0, default: 10 [hyperparameter]
categorical_smoothing = 10

# Finite (categorical) axes split by Fisher-ordered level partitions; false treats their level codes as ordered numbers (threshold splits), the way the reference boosters see integer-coded categories (v26 investigation).
#   type: bool, default: true [hyperparameter]
categorical_splits = true

# Rarer categorical bins never enter the left set of a split.
#   type: int, min: 0, default: 5 [hyperparameter]
min_rows_per_category = 5

[ensemble]

# In-product ensemble: the labeled rows are partitioned into this many stratified groups, member k holds out group k (so every row has one out-of-fold prediction), members differ in the CDF blend; predictions are averaged. 1 = a single model (the harness's --ensemble regime averages separate models instead).
#   type: int, min: 1, max: 32, default: 8 [hyperparameter]
members = 8

# Members trained concurrently, each on its own CPU pool and pinned round-robin to the usable CUDA devices in measured order. auto: derived at run time from the assessed hardware (ADR-0021): members per device limited by the free device memory against the member's footprint and by the SM count (about one concurrent member per 40 SMs, at least one), the total by four CPU threads per member; on a CPU-only host one member per eight threads. 1 = sequential (identical results).
#   type: int, min: 1, or 'auto', default: auto [hyperparameter]
parallel_members = auto

# Members after the first wave search only {h/3, h, 3h} around the relative noise the first member selected, in the main fit and the candidate stages (the first wave keeps the full grid): solver trials halve, errors unchanged within noise (research/v23_speed, ADR-0022).
#   type: bool, default: true [hyperparameter]
noise_bracket = true

# Members after the first start geometry learning from the first member's learned geometry with ensemble.warm_start_rounds rounds instead of learning.rounds from the initial kernel (the first member runs alone, then the rest in parallel).
#   type: bool, default: false [hyperparameter]
warm_start = false

# Learner rounds for warm-started members.
#   type: int, min: 1, max: 64, default: 2 [hyperparameter]
warm_start_rounds = 2

# CDF blend of the first member (members spread linearly to blend_max).
#   type: double, min: 0, max: 1, default: 0.3 [hyperparameter]
blend_min = 0.3

# CDF blend of the last member.
#   type: double, min: 0, max: 1, default: 0.7 [hyperparameter]
blend_max = 0.7

# Select the kernel noise level once from the members' hold-out curves summed over the common grid (a K-fold cross-validation at no extra fits) and refit every member at it, instead of each member choosing on its own hold-out. Off by default (v18 small set: the members' individual choices are diversity the average exploits; the pooled choice lost on steps and splice).
#   type: bool, default: false [hyperparameter]
pooled_noise = false

# Choose the residual trees' round count and base scale once from the members' pooled cross-validation curves. Off by default (v18: one shared choice removed member diversity; steps 0.70 -> 0.82, splice 0.73 -> 0.80).
#   type: bool, default: false [hyperparameter]
pooled_trees = false

# Fit the calibrator and the conformal quantile on the out-of-fold predictions of all labeled rows (every row from the one member that held it out) instead of on each member's 1/M hold-out. Off by default (v18): a calibrator fitted on single-member scores and applied to averaged logits, which are less dispersed, over-shrinks; the conformal quantile always uses the out-of-fold predictions.
#   type: bool, default: false [hyperparameter]
oof_calibration = false

# Classification: average the members' logits (then the shared calibrator) or their probabilities. Regression always averages label-space predictions.
#   type: enum {logits|probabilities}, default: logits [hyperparameter]
combine = logits

[stack]

# Neighbour member of the partition ensemble (ADR-0023). Each member's hold-out rows find their k nearest rows among that member's own training rows in its learned kernel metric d^2 = k(u,u) + k(v,v) - 2 k(u,v); the vote (class frequencies smoothed toward the prior, or the label mean) is averaged over the members and blended with the kernel ensemble. k (stack.neighbor_k_grid) and the blend weight (stack.weight_steps) minimize the task's out-of-fold metric (1-AUC, log loss, RMSE); the member is kept only when it beats the kernel ensemble by stack.min_gain. off: never; on: tried whenever stack.neighbor_min_rows labeled rows exist; auto: on for binary and regression tasks, not above stack.neighbor_auto_max_rows rows (the stored reference rows cost inference time and model size) and not on multiclass tasks (v24: out-of-fold log-loss gains that passed every gate did not hold on the test folds; the blend of a vote into calibrated multiclass probabilities is validated on single-member probabilities but applied to the ensemble's). Ensembles only (ensemble.members > 1).
#   type: enum {off|on|auto}, default: off [hyperparameter]
neighbor = off

# Neighbour counts tried on the out-of-fold predictions.
#   type: int-list, default: 5,10,20,40,80 [hyperparameter]
neighbor_k_grid = 5,10,20,40,80

# Distance of the neighbour member. relevance: the member's learned relevances as a diagonal metric on the axis coordinates (squared coordinate differences on numeric axes, the learned level dissimilarity on categorical axes, scaled to unit mean), never degenerate. kernel: the kernel-induced distance k(u,u) + k(v,v) - 2k(u,v), which collapses to rounding noise when a member's kernel is smoother than the sample spacing (v24).
#   type: enum {relevance|kernel}, default: relevance [hyperparameter]
neighbor_metric = relevance

# Vote weights of the k neighbours: uniform; distance (w_j = exp(-d_j^2 / d_k^2), the k-th neighbour's distance as bandwidth, so duplicates of the query dominate); auto tries both on the out-of-fold predictions and keeps the better.
#   type: enum {auto|uniform|distance}, default: auto [hyperparameter]
neighbor_weighting = auto

# Reference rows stored per member (a uniform stride sample of its training rows beyond this; bounds the model size and the per-row inference cost, which grows linearly with the references).
#   type: int, min: 10, default: 20000 [hyperparameter]
neighbor_max_rows = 20000

# Labeled rows below which the neighbour member is not tried (the out-of-fold choice of k and weight is too noisy).
#   type: int, min: 10, default: 300 [hyperparameter]
neighbor_min_rows = 300

# stack.neighbor = auto: labeled rows above which the member is not tried.
#   type: int, min: 10, default: 100000 [hyperparameter]
neighbor_auto_max_rows = 100000

# Relative improvement of the out-of-fold metric the blend must show over the kernel ensemble to be adopted (v24: out-of-fold gains below about 2 % did not survive on the test folds of small datasets; gains above did).
#   type: double, min: 0, max: 1, default: 0.02 [hyperparameter]
min_gain = 0.02

# Blend weights tried: 1/steps, 2/steps, ..., 1.
#   type: int, min: 1, max: 1000, default: 20 [hyperparameter]
weight_steps = 20

# Cross-validate the selection of k, weighting and blend weight before adopting: select on the even members' out-of-fold rows and evaluate on the odd members' rows and the reverse; both directions must gain and their mean must reach stack.min_gain (the plain selection over-fits small out-of-fold sets).
#   type: bool, default: true [hyperparameter]
cv_gate = true

# Classification: pseudo-count of the class prior added to the neighbour counts before normalizing (keeps the vote away from 0 and 1).
#   type: double, min: 0, max: 1000, default: 1.0 [hyperparameter]
smoothing = 1.0

[diagnostics]

# Structured run diagnostics (JSON lines) next to the model / the predictions; off by default, so a run leaves only its output file (ADR-0033); the benchmark harness and research runs turn it on. summary = per-stage and per-round events (data profile, axes, relevances, ridge selection, calibration, refit, inference drift); full = additionally per-iteration optimizer events, per-trial solver events, gradient listings and full per-axis tables.
#   type: enum {off|summary|full}, default: off [system]
level = full

# Debug: write the member's preprocessed training axes (<path>_train.csv) and hold-out axes (<path>_holdout.csv), axis-named columns plus the label, for exact-input comparisons with reference learners; 'none' disables.
#   type: string, default: none [system]
dump_axes = none

# Diagnostics file; auto = <model>.diag.jsonl for training and <predictions>.diag.jsonl for inference.
#   type: string, default: auto [system]
path = auto

# Cap on the length of full vectors and per-axis tables in one event (longer ones record how many entries were omitted).
#   type: int, min: 0, default: 4096 [system]
max_vector = 4096

# Entries in the 'largest |value|' listings (gradients, relevance changes).
#   type: int, min: 1, default: 16 [system]
# top_k = 16
top_k = 4096

# Under level = full: one event per accepted L-BFGS iteration and per IRLS iteration.
#   type: bool, default: true [system]
iteration_events = true

# Fit the initial (unlearned) kernel with the same ridge selection and record its hold-out loss next to the learned kernel's (event learning/transfer): whether geometry learning generalizes. Costs one extra fit stage.
#   type: bool, default: false [system]
# learner_transfer_check = false
learner_transfer_check = true

# Under level = full: central-difference check of the learner's gradient on a few parameters at the start of round 0.
#   type: bool, default: true [system]
gradient_check = true

[output]

# Write <model>.report.txt (every stage's decisions) next to the model file. Off by default: a run leaves only the model file (ADR-0033).
#   type: bool, default: false [system]
report = false

# Classification: write one p_<class> probability column per class after the predicted label.
#   type: bool, default: true [system]
probabilities = true

# Significant digits for numeric prediction output.
#   type: int, min: 3, max: 17, default: 9 [system]
precision = 9

# Write conformal 'lower'/'upper' columns (regression) or a 'conformal_set' column (classification) when the model carries a conformal calibration.
#   type: bool, default: true [system]
intervals = true

