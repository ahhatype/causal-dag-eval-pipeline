# PROVISIONAL: library and explained-record counts pending confirmation.
# Monte Carlo budgets: two independent estimates at these budgets agree closely on every evaluation metric.

seed: 20261200               # per-run seeds add replicate and data-set offsets
datasets: [full_set, reference_subsample, astronaut_set]
feature_sets: [ancestor, all]
methods: [standard_shap, ordering_only_shap, ng_style_shap, interventional_shap]

split:
  test_fraction: 0.30        # stratified by outcome

explain:
  records: 64                # held-out records explained by every method, drawn at random (no event swap)
  flag_min_events: 4         # runs with fewer outcome events among them are flagged, not altered
  background: 128            # training records used as the background sample

super_learner:
  folds: 10

workers: 7                   # cells run in parallel, each on one core

standard_shap:
  permutations: 64           # 32 antithetic pairs

ng_style_shap:
  samples: 64                # Monte Carlo draws per coalition value (M), shared by the coalitions of each order
  orders: 64                 # 32 antithetic pairs
  exclude_below: 0.001       # primary importance excludes records with |pre-rescaling total| below this
  rescale_flag: 50           # |rescaling factor| above this is counted as a diagnostic

ordering_only_shap:          # orders sampled as for interventional SHAP; background replacement as the value function
  orders: 64
  burn_in: 2000
  thin: 50

interventional_shap:
  orders: 64
  burn_in: 2000              # adjacent-swap steps before the first order
  thin: 50                   # adjacent-swap steps between orders

evaluation:
  top_k: 5                   # descriptive only
  tie_margins: [0.02, 0.05]  # equivalence margin as a share of the largest |truth|; the first is primary
  tie_z: 1.96                # sensitivity: ties within z combined MCSE

# Oracle reference: the true outcome probability and true structural equations replace the fitted ones.
oracle:
  replicates: 10             # replicates 1..N, ancestor feature set, every data set
  pool: 20000                # records simulated from the true model: backgrounds and path weights
  background: 128
  seed: 20261300

# Causal predictive SHAP convergence on phi: two independent halves per order budget, replicate 1 of each data set.
ng_convergence:
  orders: [64, 150, 300]
  min_tau_b: 0.9
  min_correlation: 0.95
  max_budget_factor: 4       # keep doubling past the last budget until it passes or exceeds this x current runtime
  seed: 20261400

# ConfoundingSHAP (Brockschmidt et al. 2026), run by run_confounding_shap.py on both confounded drugs.
confounding_shap:
  treatments: [k_citrate, bisphosphonates]
  datasets: [reference_subsample, astronaut_set]
  replicates: 10
  budget: 64                 # coalitions per run, shapiq RegressionMSR (exact computation when budget >= 2^covariates)
  n_estimators: 1            # TabPFN estimators per fit, as in the paper's synthetic experiments
  proxy_model: tree          # RegressionMSR proxy; shapiq's default xgboost segfaults alongside torch on this Mac
  model_version: v2.5        # the paper's model; needs licence acceptance and a Hugging Face login (see README)
  reference:                 # reference credits from the true model: records simulated, permutations, seed
    records: 50000
    permutations: 100
    seed: 20261500
