[project]
name = "attribution-validation"
version = "0.1.0"
description = "Standard and causal SHAP attributions on the replicate data sets, evaluated against simulated total effects."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<2",
    "networkx>=3.3,<4",
    "pyyaml>=6,<7",
    "shap>=0.46,<0.53",
    "threadpoolctl>=3,<4",
    # shap's numba constraint otherwise lets the resolver fall back to versions that cannot build
    "numba>=0.60,<0.63",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attribution_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
